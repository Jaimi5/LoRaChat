; Bench tool, not part of the product: a T-Beam that joins a node's maintenance access point
; and forwards uploads streamed from the PC over USB serial (scripts/ota_tools/ap_upload.py).
; Same partition table as the product, so flashing only the app keeps the board's NVS.
[env:bridge]
platform = espressif32@6.5.0
framework = arduino
board = ttgo-t-beam
board_build.partitions = ../../partitions.csv
monitor_speed = 921600
build_unflags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
