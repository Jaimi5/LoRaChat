# Sleep campaign — 13-node delivery A/B arm, SF12 (same cell as lm200_13node.yaml
# SF12_d308000). Same batch name as lm200s_13node_SF9.yaml, so both cells land in
# runs/lm200s_13node__<tag> and G1 / ab see them together.
batch: lm200s_13node
description: 13-node fair PDR A/B, SF12 overload (sleep campaign)
base: ../lm200/experiments/lm200_base.yaml

runs: 1
warmup_min: 25
duration_min: 40
cooldown_min: 2
reset_between_runs: true
upload_between_cells: true
warmup_run: false

cells:
  - id: SF12_d308000
    overrides:
      lora_spreading_factor: 12
      lora_default_data_slots: 1
      lora_max_data_slots: 50
      lora_min_sleep_fraction: 0.0
      lora_manager_id: '0x006C'
      sim_sleep_mode: 0
      sim_send_path: 0   # 0 = classic sendPacketsToServer
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 5
      packet_delay: 308000
      sim_testbed_warmup_ms: 1500000  # = warmup_min 25
      sim_reliable: 0
      sim_group: 0
      sim_stopstart: 0
      sim_nm_failover_ms: 0
    inactive_devices: [DD58, 14A4, '3428']
