# Sleep campaign — reliable unicast with 3 data slots per node, SF9 (G2 reliable).
#
# Same cell as lm200_features_rerun.yaml reliable_SF9_dds3, with a 5 min cooldown for
# the TDMA round-trip tail.
batch: lm200s_reliable
description: Reliable unicast, SF9, 3 data slots per node (sleep campaign, FIX)
base: ../lm200/experiments/lm200_base.yaml

runs: 1
warmup_min: 15
duration_min: 23
cooldown_min: 5
reset_between_runs: true
upload_between_cells: true
warmup_run: false

cells:
  - id: reliable_SF9_dds3
    overrides:
      lora_spreading_factor: 9
      lora_default_data_slots: 3
      lora_max_data_slots: 50
      lora_min_sleep_fraction: 0.0
      lora_manager_id: '0x006C'
      sim_sleep_mode: 0
      sim_send_path: 0   # 0 = classic sendPacketsToServer
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 10
      packet_delay: 95000
      sim_testbed_warmup_ms: 900000
      sim_reliable: 1
      sim_group: 0
      sim_stopstart: 0
      sim_nm_failover_ms: 0
    inactive_devices: [DD58, 14A4, '3428']
