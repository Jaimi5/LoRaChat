# LoRaMesher v1-vs-v2 head-to-head: end-to-end PDR / goodput / latency under a
# controlled, fixed-size offered load generated by the SIMULATOR (not the MQTT
# monitor — whose packet size is dictated by the routing table and which v2
# fragments differently than v1, an unfair confound).
#
# How the comparison works
# ------------------------
#   * Run THIS SAME batch twice — once flashed with v1, once with v2 — on the
#     same boards / topology:
#         DEFAULT_ENV=ttgo-t-beam     ./runner/run_batch.py batches/sim_load_compare.yaml   # v1
#         DEFAULT_ENV=ttgo-t-beam-v2  ./runner/run_batch.py batches/sim_load_compare.yaml   # v2
#     (or pass `-e <env>` if run_batch forwards it to deploy.sh). Same RF
#     environment => environmental confounds cancel; the only variable is the
#     library version.
#   * sim_pdr_compare=1 makes the firmware run the simulator as a fixed-rate,
#     fixed-size LoRa load generator (replaces MQTT-mon; see src/config.h).
#     one_sender=0 => every ACTIVE node sends concurrently (full mesh load).
#   * Metric is version-neutral and lives ABOVE the library: each origin logs
#     `APP_TX src=.. seq=..` and the sink logs `APP_RX src=.. seq=..`. Analysis:
#         analysis/app_pdr.py  -> per-run PDR / goodput / latency
#         analysis/multirun.py -> per-cell mean +/- 95% CI (app_pdr, app_goodput_Bps, ...)
#
# Payload sizing (max PHY packet != max payload!)
# -----------------------------------------------
#   packet_size is the LoRaMesher PAYLOAD (src/simulator/sim.cpp:createSimPayloadMessage).
#   v2 caps the PHY packet per SF (SF12 -> 51 B PHY, ~41 B payload after the 10 B
#   header); v1 uses a fixed LM_MAX_PACKET_SIZE=100 regardless of SF. Both
#   FRAGMENT anything larger. packet_size=40 -> ~50 B PHY on v2 (<= the 51 B SF12
#   cap) and a single packet on v1 too, so each send is ONE fair packet on both.
#
# Offered load (the swept axis)
# -----------------------------
#   Load is set by packet_delay (ms between a node's packets), IDENTICAL for v1
#   and v2 within each cell. The delays are anchored on the SUSTAINABLE per-source
#   rate C/F from docs/paper/sf_offered_load_capacity.md (§3, §5), NOT the raw
#   per-node ceiling C. A relay forwards other nodes' packets through its own
#   single data slot, so the busiest relay (fan-in F~4) is the bottleneck, and the
#   sustainable per-source rate is C/F:
#       SF7 ~1.25   SF9 ~0.79   SF12 ~0.13   pkt/min   (paper §5)
#   so the load for a target bottleneck utilization rho is
#       packet_delay_ms = 60000 / (rho * (C/F))
#   Two points per SF spanning the knee: rho~0.5 (safe margin — both versions
#   should deliver well, confirms parity) and rho~1.2-1.5 (at/just past relay
#   saturation — where v2's slot scheduling should hold while v1, with no TDMA
#   pacing, collapses, as it did in the paper's SF12 run). NOTE: these rho values
#   come from the v2 TDMA capacity model and are only used to PLACE the load
#   points; the offered load itself is identical for both versions. SF12's
#   sustainable rate is so low (~0.13 pkt/min => ~8 min between packets) that a
#   sub-saturation point is impractical to sample, so SF12 uses rho~1.0 and ~1.5.
#   v1@SF12 is largely untested — if it collapses, that is a legitimate result
#   kept and reported, not dropped.
#
# Timing (the run just has to outlast the burst + its deliveries)
# ---------------------------------------------------------------
#   app_pdr analyses the FULL log (the sim emits only the burst), so the burst
#   does NOT need to be aligned with run_batch's measurement window. The two
#   "warmups" are the same convergence wait, told to two places, and only need to
#   each exceed convergence — they do not need to match precisely:
#
#   1. warmup_min  = host wait before the run's window (bookkeeping / run length).
#   2. sim_testbed_warmup_ms = warmup_min, in ms = the firmware's own pre-burst
#      wait so it does not transmit before the mesh has formed. The firmware also
#      waits for a gateway, so the real burst start is max(this, convergence).
#      The analytical convergence floor (model.convergence_floor_s, N=13, 1 slot)
#      is 1.7/2.5/7.6 min for SF7/9/12 — a LOWER bound; we use the empirically
#      validated 15 min (SF7/SF9) / 25 min (SF12) from main_cluster_pdr_static.
#   3. duration_min = burst + tail, where burst = packet_count*packet_delay and
#      tail covers the last packet's end-to-end delivery latency (a few * the
#      recurrence R=26/38/114 s, more under saturation — the paper saw ~488 s at
#      SF12 overload). Tails used: ~6/7/14 min. The host logs for
#      warmup_min+duration_min, which comfortably spans the firmware burst.
#
#   SF12 cells still run ~1.5 h each (25 min warmup + ~1 h burst + tail). Trim
#   packet_count or drop a load point if time-constrained.
batch: sim_load_compare
description: v1-vs-v2 end-to-end PDR/goodput under sim-generated fixed-size load, per-SF load sweep
base: ../experiments/example-baseline.yaml

runs: 1                   # 1 measured rep/cell; ~13 senders x N packets is already
                          # a large PDR sample. Raise to 2-3 later for cross-run CI
                          # on any cell where v1-vs-v2 looks close.
duration_min: 30          # per-cell overrides below take precedence
warmup_min: 15            # mesh convergence; SF12 cells override to 25
cooldown_min: 2
reset_between_runs: true
upload_between_cells: true
warmup_run: false         # each rep already waits warmup_min for convergence, and
                          # reset_between_runs re-converges anyway, so a separate
                          # r00 warm-up rep adds little here — skipped to save time.

cells:
  # ---- SF7 (sustainable C/F ~1.25 pkt/min/source) ------------------------------
  - id: SF7_d96000          # rho~0.5 (0.63 pkt/min) — safe margin, expect high PDR both
    overrides:
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 25
      lora_spreading_factor: 7
      packet_delay: 96000
      sim_testbed_warmup_ms: 900000     # = warmup_min 15
    warmup_min: 15
    duration_min: 46        # burst 40 + tail 6
    inactive_devices: &remote
      - DD58
      - 14A4
      - '3428'
  - id: SF7_d40000          # rho~1.2 (1.5 pkt/min) — past relay saturation
    overrides:
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 30
      lora_spreading_factor: 7
      packet_delay: 40000
      sim_testbed_warmup_ms: 900000     # = warmup_min 15
    warmup_min: 15
    duration_min: 26        # burst 20 + tail 6
    inactive_devices: *remote

  # ---- SF9 (sustainable C/F ~0.79 pkt/min/source) ------------------------------
  - id: SF9_d152000         # rho~0.5 (0.39 pkt/min) — safe margin
    overrides:
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 18
      lora_spreading_factor: 9
      packet_delay: 152000
      sim_testbed_warmup_ms: 900000     # = warmup_min 15
    warmup_min: 15
    duration_min: 53        # burst 45.6 + tail 7
    inactive_devices: *remote
  - id: SF9_d63000          # rho~1.2 (0.95 pkt/min) — past relay saturation
    overrides:
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 25
      lora_spreading_factor: 9
      packet_delay: 63000
      sim_testbed_warmup_ms: 900000     # = warmup_min 15
    warmup_min: 15
    duration_min: 34        # burst 26.25 + tail 7
    inactive_devices: *remote

  # ---- SF12 (sustainable C/F ~0.13 pkt/min/source; slow — kept for v1 test) -----
  # Sub-saturation is impractical (~8 min/packet), so SF12 probes rho~1.0 and ~1.5.
  - id: SF12_d462000        # rho~1.0 (0.13 pkt/min) — at relay saturation
    overrides:
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 8
      lora_spreading_factor: 12
      packet_delay: 462000
      sim_testbed_warmup_ms: 1500000    # = warmup_min 25
    warmup_min: 25
    duration_min: 76        # burst 61.6 + tail 14
    inactive_devices: *remote
  - id: SF12_d308000        # rho~1.5 (0.20 pkt/min) — overload
    overrides:
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 10
      lora_spreading_factor: 12
      packet_delay: 308000
      sim_testbed_warmup_ms: 1500000    # = warmup_min 25
    warmup_min: 25
    duration_min: 66        # burst 51.3 + tail 14
    inactive_devices: *remote
