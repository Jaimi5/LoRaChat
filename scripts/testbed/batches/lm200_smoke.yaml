# LoRaMesher 2.0.0 evaluation — Tier 0 smoke run (gate G0).
#
# One short SF9 cell on the 13-node main cluster with the sim load generator. All 16
# boards are flashed (the remote three boot silent with node_active=0, so the boot /
# crash / build-env checks still cover every board); join/routing/PDR checks cover the
# 13 active nodes. The long link is deliberately NOT part of the smoke gate: at SF9 it
# sits at the demod threshold and flaps for link-margin reasons unrelated to the library
# (see lm200_reach16 / lm200_features long_link for that).
batch: lm200_smoke
description: 2.0.0 smoke - SF9, 13-node main cluster, light sim load, 20 min
base: ../lm200/experiments/lm200_base.yaml

runs: 1
duration_min: 20
warmup_min: 3
cooldown_min: 1
reset_between_runs: true
upload_between_cells: true
warmup_run: false

cells:
  - id: SF9_smoke
    overrides:
      lora_spreading_factor: 9
      sim_pdr_compare: 1
      one_sender: 0
      packet_size: 40
      packet_count: 10
      packet_delay: 63000            # ~10.5 min burst, rho well below saturation
      sim_testbed_warmup_ms: 300000  # burst starts 5 min after the sync reset
    inactive_devices: [DD58, 14A4, '3428']
