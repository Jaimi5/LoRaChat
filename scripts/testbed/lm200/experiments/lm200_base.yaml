# LoRaMesher 2.0.0 eval base: example-baseline + all feature flags off
#
# Derived from experiments/example-baseline.yaml. ALL lm200 feature flags are set in
# `defaults` (0 unless a cell overrides them): change-config's sed edits ONE shared
# src/config.h per gateway, so a flag set only on one device would leak into the next
# device flashed on that gateway. Per-device values below override defaults.
# sim_group_addr is deliberately left at the firmware default (config.h).
experiment: lm200_base
description: 'LoRaMesher 2.0.0 eval base: example-baseline + all feature flags off'
defaults:
  lora_bandwidth: 125.0
  lora_coding_rate: 7
  lora_frequency: 869.525
  lora_manager_id: '0x006C'
  lora_spreading_factor: 9
  lora_sync_word: 20
  lora_duty_cycle: 0.1
  mqtt_password: public
  mqtt_port: 1883
  mqtt_server: 192.168.192.1
  mqtt_topic_out: to-server/
  mqtt_topic_sub: from-server/
  mqtt_username: admin
  sim_reliable: 0
  sim_group: 0
  sim_stopstart: 0
  sim_stopstart_period_ms: 600000
  sim_stopstart_off_ms: 120000
  sim_nm_failover_ms: 0
devices:
  006C:
    lora_power: 14
    wifi_password: xxx
    wifi_ssid: nowifi
  '1484':
    lora_power: 2
    wifi_password: xxx
    wifi_ssid: nowifi
  14A4:
    lora_power: 2
    wifi_password: xxx
