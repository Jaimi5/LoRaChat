; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Compiled objects are reused across envs and after PlatformIO wipes .pio/build
; (any platformio.ini edit or added/removed source file triggers that wipe).
build_cache_dir = ${platformio.workspace_dir}/build_cache

[env]
platform = espressif32@6.5.0
framework = arduino, espidf
monitor_speed = 115200
build_type = release
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
test_build_src = true

; --- Product firmware: TTGO T-Beam v1.0/v1.1 (AXP192) and v1.2 (AXP2101), one image ---
; The PMU model is detected at runtime. sdkconfig.<env> holds the ESP-IDF options.

[env:tbeam]
board = ttgo-t-beam
; Sets the image version from version.txt (see the script)
extra_scripts = pre:scripts/ota_tools/version_hook.py
lib_deps =
	SPI
	Wire
	adafruit/Adafruit SSD1306@^2.5.6
	adafruit/Adafruit GFX Library@^1.11.3
	ArduinoJSON@6.21.4
	https://github.com/lewisxhe/XPowersLib
	; LoRaMesher 2.0.0, followed on the release/2.0.0 branch until it is tested
	https://github.com/LoRaMesher/LoRaMesher.git#release/2.0.0
lib_ignore = loramesher
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D BUILD_ENV_NAME="\"$PIOENV\""
	-D T_BEAM
	-std=gnu++2a
	-Wno-unknown-pragmas
; The board JSON adds PSRAM flags, but PSRAM is disabled in the sdkconfig.
build_unflags =
	-std=gnu++11 -std=gnu++14 -std=gnu++17
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue

; Same image with verbose logs, heap poisoning and heap tracing (sdkconfig.tbeam-debug).
[env:tbeam-debug]
extends = env:tbeam

; --- Native unit tests (pure logic in lib/, no Arduino) ---

[env:native]
platform = native
framework =
board_build.partitions =
lib_deps = google/googletest@^1.12.1
test_framework = googletest
test_build_src = no
build_type = debug
extra_scripts = pre:scripts/native_mbedtls.py
build_flags =
	-std=gnu++17
	-I test/fakes
	-I test/vectors
	-fsanitize=address,undefined
	-fno-sanitize=vptr
	-fno-omit-frame-pointer
	-g
