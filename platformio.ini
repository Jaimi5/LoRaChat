; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[platformio]
; Set a path to a cache folder
;build_cache_dir = .pio/build_cache

[env]
;platform = espressif32@5.2.0
platform = espressif32@6.5.0
framework = arduino, espidf
monitor_speed = 115200
build_type = release
monitor_filters = esp32_exception_decoder
lib_deps =
	Vector
	SPI
	Wire
	mikalhart/TinyGPSPlus
	lewisxhe/AXP202X_Library
	plerup/espsoftwareserial
	adafruit/Adafruit SSD1306@^2.5.6
	adafruit/Adafruit GFX Library@^1.11.3
	OneWire
	ArduinoJSON@6.21.4
	https://codeload.github.com/dok-net/ghostl/zip/refs/tags/1.0.1
	https://github.com/olikraus/U8g2_Arduino
	https://github.com/sparkfun/SparkFun_Ublox_Arduino_Library#v1.7.2

board_build.partitions = partitions.csv
test_build_src = true
build_flags =
	-D CORE_DEBUG_LEVEL=5
	-D BUILD_ENV_NAME="\"$PIOENV\""
	-Wno-unknown-pragmas
	-fno-omit-frame-pointer

; --- Base sections for LoRaMesher version selection ---

[base_v1]
; LoRaMesher v0.0.11 (singleton, task-based API)
lib_deps = LoRaMesher@^0.0.11
lib_ignore = loramesher

[base_v2]
; LoRaMesher v1.0.0 (Builder pattern, callback-based API)
; Fetched from GitHub new_loramesher branch
lib_deps = https://github.com/LoRaMesher/LoRaMesher.git#new_loramesher
lib_ignore = loramesher
build_flags =
	-D USE_LORAMESHER_V2
	-std=gnu++2a
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17

; --- V1 board environments (LoRaMesher v0.0.11) ---

[env:ttgo-t-beam]
board = ttgo-t-beam
lib_deps = ${env.lib_deps}
	${base_v1.lib_deps}
	https://github.com/sparkfun/SparkFun_Ublox_Arduino_Library
	https://github.com/lewisxhe/XPowersLib ; PMU AXP192/AXP2101 support
lib_ignore = ${base_v1.lib_ignore}
build_flags =
	${env.build_flags}
	-D T_BEAM_V10

[env:ttgo-t-beam-v1-2]
board = ttgo-t-beam
lib_deps = ${env.lib_deps}
	${base_v1.lib_deps}
    https://github.com/lewisxhe/XPowersLib ; PMU AXP192/AXP2101 support
lib_ignore = ${base_v1.lib_ignore}
build_flags =
	${env.build_flags}
	-D T_BEAM_V12

[env:ttgo-lora32-v1]
board = ttgo-lora32-v1
lib_deps = ${env.lib_deps}
	${base_v1.lib_deps}
lib_ignore = ${base_v1.lib_ignore}
build_flags =
	${env.build_flags}
	-D T_BEAM_LORA_32

[env:esp-wrover-kitNAYAD_V1R2]
board = esp-wrover-kit
lib_deps = ${env.lib_deps}
	${base_v1.lib_deps}
lib_ignore = ${base_v1.lib_ignore}
build_flags =
	${env.build_flags}
	-D NAYAD_V1R2

;[env:esp-wrover-kitNAYAD_V1]
;board = esp-wrover-kit
;lib_deps = ${env.lib_deps}
;	${base_v1.lib_deps}
;lib_ignore = ${base_v1.lib_ignore}
;build_flags =
;	${env.build_flags}
;	-D NAYAD_V1

[env:MAKERFABS_SENSELORA_MOISTURE]
board = esp32-s3-devkitc-1
lib_deps = ${env.lib_deps}
	${base_v1.lib_deps}
lib_ignore = ${base_v1.lib_ignore}
build_flags =
	${env.build_flags}
	-D MAKERFABS_SENSELORA_MOISTURE

; --- V2 board environments (LoRaMesher v1.0.0) ---
; Note: NAYAD boards are v1-only (v2 doesn't support SX1262 yet)

[env:ttgo-t-beam-v2]
board = ttgo-t-beam
lib_deps = ${env.lib_deps}
	${base_v2.lib_deps}
	https://github.com/sparkfun/SparkFun_Ublox_Arduino_Library
	https://github.com/lewisxhe/XPowersLib ; PMU AXP192/AXP2101 support
lib_ignore = ${base_v2.lib_ignore}
build_flags =
	${env.build_flags}
	${base_v2.build_flags}
	-D T_BEAM_V10
build_unflags = ${base_v2.build_unflags}

[env:ttgo-t-beam-v1-2-v2]
board = ttgo-t-beam
lib_deps = ${env.lib_deps}
	${base_v2.lib_deps}
    https://github.com/lewisxhe/XPowersLib ; PMU AXP192/AXP2101 support
lib_ignore = ${base_v2.lib_ignore}
build_flags =
	${env.build_flags}
	${base_v2.build_flags}
	-D T_BEAM_V12
build_unflags = ${base_v2.build_unflags}

[env:ttgo-lora32-v1-v2]
board = ttgo-lora32-v1
lib_deps = ${env.lib_deps}
	${base_v2.lib_deps}
lib_ignore = ${base_v2.lib_ignore}
build_flags =
	${env.build_flags}
	${base_v2.build_flags}
	-D T_BEAM_LORA_32
build_unflags = ${base_v2.build_unflags}

[env:MAKERFABS_SENSELORA_MOISTURE-v2]
board = esp32-s3-devkitc-1
lib_deps = ${env.lib_deps}
	${base_v2.lib_deps}
lib_ignore = ${base_v2.lib_ignore}
build_flags =
	${env.build_flags}
	${base_v2.build_flags}
	-D MAKERFABS_SENSELORA_MOISTURE
build_unflags = ${base_v2.build_unflags}
